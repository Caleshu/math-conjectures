[project]
name = "mathresearchlab-backend"
version = "0.1.0"
description = "MathResearchLab API, job worker, discovery pipeline and computation sandbox"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "pdfminer.six>=20240706",
  "networkx>=3.3",
  "sympy>=1.13",
  "ortools>=9.10",
  "psycopg[binary]>=3.2",
  "pyjwt[crypto]>=2.9",
  "python-multipart>=0.0.9",
  "anthropic>=2.0",
  "openai>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that call external APIs (deselect with -m 'not network')"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
