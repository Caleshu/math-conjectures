[DistantFaults]
title = "Hypercubes with distant faulty vertices (Gregor–Škrekovski)"
category = "open"
result = "Holds for n ≤ 6 in both forms (exhaustive)"
verification = "Computational evidence"

[CurrieExponent]
title = "Critical exponents of morphic images (Currie Conj. 1)"
